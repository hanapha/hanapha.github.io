<head>
  <meta charset="utf-8" />
  <meta content='width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no'
    name='viewport' />
  <meta content='b0fc44f5d9d48c6f' name='yandex-verification' />
  <meta name="google-site-verification" content="cefVJsiXXd_rvFHjT5zeIdcWCaRWuHXy8aWG73FhfVo" />

  <!-- CANONICAL -->
  <link rel="canonical" href="{{ page.url | absolute_url }}" />

  {% seo %}

  <!-- OPEN GRAPH (Facebook / WhatsApp) -->
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description"
    content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}" />
  <meta property="og:image" content="{{ page.image | default: site.logo | absolute_url }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="{{ site.title }}" />

  <!-- TWITTER CARD -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ page.title | default: site.title }}" />
  <meta name="twitter:description"
    content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}" />
  <meta name="twitter:image" content="{{ page.image | default: site.logo | absolute_url }}" />

  <!-- FAVICON -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <!-- jQuery migrate (optional) -->
  <script src="//code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src='https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js'></script>
  <script src="https://hanapha.com/banner/popunder.js"></script>

  <!-- Google tag (hanapha.com) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7JH36LYC8Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag('js', new Date());
    gtag('config', 'G-7JH36LYC8Y');
  </script>
</head>
