<head>
  <meta charset="utf-8" />
  <meta content='width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no'
    name='viewport' />
  <meta content='b5396f0c4b172df1' name='yandex-verification' />

  <!-- CANONICAL -->
  <link rel="canonical" href="{{ page.url | absolute_url }}" />

  {% seo %}

  <!-- OPEN GRAPH (Facebook / WhatsApp) -->
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description"
    content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}" />
  <meta property="og:image" content="{{ page.image | default: site.logo | absolute_url }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="{{ site.title }}" />

  <!-- TWITTER CARD -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ page.title | default: site.title }}" />
  <meta name="twitter:description"
    content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}" />
  <meta name="twitter:image" content="{{ page.image | default: site.logo | absolute_url }}" />

  <!-- FAVICON -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <!-- jQuery migrate (optional) -->
  <script src='//cdnjs.cloudflare.com/ajax/libs/jquery-migrate/3.3.2/jquery-migrate.min.js'></script>
  <script src='//ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js'></script>
  <script async='async' crossorigin='anonymous'
    src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1635452676980519'></script>

</head>
